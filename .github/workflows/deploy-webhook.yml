# Deploys the WhatsApp webhook (Supabase Edge Function) from GitHub —
# no terminal needed.
#
# One-time setup: add a repository secret named SUPABASE_ACCESS_TOKEN
# (Supabase → your avatar → Account preferences → Access Tokens → Generate).
# The project is read from VITE_SUPABASE_URL in .env.production (same as MachTrek).
#
# Runs automatically when the function code changes on main, or by hand:
# Actions → "Deploy WhatsApp webhook" → Run workflow.
#
# Meta secrets are NOT stored here. Set them in the Supabase dashboard:
# Edge Functions → Secrets (see README).

name: Deploy WhatsApp webhook

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-webhook.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: whatsapp-webhook-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check setup
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret first (Settings → Secrets and variables → Actions)."
              exit 1
            fi
            echo "::warning::SUPABASE_ACCESS_TOKEN secret not set yet — webhook not deployed. Add it, then Run workflow."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REF=$(grep '^VITE_SUPABASE_URL=' .env.production | sed -E 's#.*https://([a-z0-9]+)\.supabase\.co.*#\1#')
          if [ -z "$REF" ]; then echo "::error::Could not read the project ref from .env.production"; exit 1; fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != 'true'
        with:
          version: latest

      - name: Deploy whatsapp-webhook
        if: steps.check.outputs.skip != 'true'
        run: |
          supabase functions deploy whatsapp-webhook \
            --project-ref "${{ steps.check.outputs.ref }}" \
            --no-verify-jwt
          {
            echo "### WhatsApp webhook deployed"
            echo ""
            echo "Callback URL for Meta:"
            echo ""
            echo "\`https://${{ steps.check.outputs.ref }}.supabase.co/functions/v1/whatsapp-webhook\`"
          } >> "$GITHUB_STEP_SUMMARY"

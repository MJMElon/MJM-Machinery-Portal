# Supabase CLI config for this repo. Only the settings this portal needs;
# the database itself is shared with MachTrek and migrated by hand (see README).
project_id = "mjm-machinery-portal"

[functions.whatsapp-webhook]
# Meta calls this URL without a Supabase JWT. Each POST is instead verified with
# Meta's X-Hub-Signature-256 (HMAC of the body using the app secret).
verify_jwt = false

[functions.case-action]
# Called from the portal. The function checks the user's Supabase token itself
# (so the browser's CORS preflight is answered too) and their edit access.
verify_jwt = false

[functions.gw-login]
# Called by the portal BEFORE it has a session (it turns the MJM Connect token
# into one), so there is no Supabase JWT to verify. The token itself is
# verified by MJM Connect's gw-check-access.
verify_jwt = false
